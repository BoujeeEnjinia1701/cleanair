pitch: >-
  An open, tool-free kit that turns a fan a facility already has into a room air cleaner: four standard MERV-13 panels,
  a scored and folded polypropylene tray and fan deck, a foam gasket and four straps. Designed to reduce airborne
  particles in field hospitals, shelters and clinics where new HVAC is not feasible; it complements ventilation and
  never replaces it.
problem: >-
  Field hospitals, emergency shelters, clinics and communal spaces often have fans and duct openings but no filtration,
  and full HVAC replacement is rarely feasible; facility managers need a low-cost way to add clean air delivery, in air
  changes per hour, from what is already on site.
